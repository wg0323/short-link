server:
  port: 8082

spring:
  application:
    name: short-link-admin-api
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/short_link?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
  redis:
    host: 127.0.0.1
    port: 6379
    database: 0
    timeout: 3000ms
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

springdoc:
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

management:
  endpoints:
    web:
      exposure:
        include: health,info

shortlink:
  jwt:
    # 后台使用与用户端完全不同的密钥，令牌不能互用
    secret: short-link-admin-api-secret-key-change-me-in-production
    expire-seconds: 28800
  admin:
    # 首次启动时若管理员表为空，自动创建该账号
    init-username: admin
    init-password: Admin@123456
