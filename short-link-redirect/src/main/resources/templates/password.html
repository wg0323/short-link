<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>访问密码 · ShortLink</title>
    <style>
        :root {
            --ink-900: #0b1220;
            --ink-400: #94a3b8;
            --ink-300: #cbd5e1;
            --brand: #2563eb;
            --line: rgba(255, 255, 255, .12);
            --danger: #f87171;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: var(--ink-900);
            color: #fff;
            font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .wrap {
            width: 100%;
            max-width: 400px;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 650;
            letter-spacing: -.01em;
        }

        .mark {
            display: grid;
            place-items: center;
            width: 26px;
            height: 26px;
            border-radius: 8px;
            background: linear-gradient(140deg, #3b82f6, #1d4ed8);
            font-size: 12px;
            font-weight: 700;
        }

        .card {
            margin-top: 32px;
            padding: 28px 24px 24px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: rgba(255, 255, 255, .04);
        }

        h1 {
            margin: 0;
            font-size: 19px;
            font-weight: 650;
            letter-spacing: -.01em;
            text-align: center;
        }

        .hint {
            margin: 10px 0 0;
            font-size: 13px;
            line-height: 1.7;
            color: var(--ink-400);
            text-align: center;
        }

        .code {
            display: inline-block;
            margin-top: 4px;
            font-family: "JetBrains Mono", ui-monospace, monospace;
            color: var(--ink-300);
        }

        label {
            display: block;
            margin: 22px 0 8px;
            font-size: 12.5px;
            color: var(--ink-400);
        }

        input[type="password"] {
            width: 100%;
            height: 44px;
            padding: 0 14px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: rgba(255, 255, 255, .06);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color .18s ease, box-shadow .18s ease;
        }

        input[type="password"]:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .22);
        }

        .error {
            margin: 10px 0 0;
            font-size: 12.5px;
            color: var(--danger);
        }

        .btn {
            width: 100%;
            height: 44px;
            margin-top: 18px;
            border: none;
            border-radius: 10px;
            background: var(--brand);
            color: #fff;
            font-size: 15px;
            font-weight: 550;
            cursor: pointer;
            transition: background .18s ease;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .foot {
            margin-top: 24px;
            font-size: 12px;
            color: #64748b;
            text-align: center;
        }
    </style>
</head>
<body>
<main class="wrap">
    <div class="brand"><span class="mark">S</span>ShortLink</div>

    <div class="card">
        <h1>该链接需要访问密码</h1>
        <p class="hint">
            链接 <span class="code" th:text="${code}">0abc123</span><br/>
            输入密码后继续访问
        </p>

        <form method="post" th:action="@{'/p/' + ${code}}">
            <label for="password">访问密码</label>
            <input id="password" name="password" type="password" required autofocus
                   autocomplete="off" placeholder="请输入访问密码"/>
            <p class="error" th:if="${error}" th:text="${error}">访问密码不正确</p>
            <button class="btn" type="submit">继续访问</button>
        </form>
    </div>

    <p class="foot">密码由短链创建者设置</p>
</main>
</body>
</html>
