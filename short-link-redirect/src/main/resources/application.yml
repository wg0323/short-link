server:
  port: 8081

spring:
  application:
    name: short-link-redirect
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/short_link?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
  redis:
    host: 127.0.0.1
    port: 6379
    database: 0
    timeout: 3000ms
  thymeleaf:
    cache: true
    encoding: UTF-8
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info

shortlink:
  redirect:
    # L1 本地缓存：条目数、异步刷新间隔、兜底过期时间
    # refresh 到点后读线程拿旧值、后台异步回源；expire 只做兜底，让旧值扛住 Redis 长时间不可用
    local-cache-size: 10000
    local-cache-refresh-seconds: 60
    local-cache-expire-seconds: 600
    # L2 Redis 缓存时间（秒），实际写入时会叠加 0-300 秒随机抖动
    redis-cache-seconds: 1800
    # 访问密码校验通过后的通行证有效期（秒）
    password-ticket-seconds: 300
  sentinel:
    # 留空则不连 Dashboard / 不从 Nacos 拉规则
    dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
    nacos-server: ${NACOS_SERVER:127.0.0.1:8848}
    nacos-group: ${SENTINEL_GROUP:SENTINEL_GROUP}
