server:
  port: 8080

spring:
  application:
    name: short-link-user-api
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/short_link?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
  redis:
    host: 127.0.0.1
    port: 6379
    database: 0
    timeout: 3000ms
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

shortlink:
  jwt:
    secret: short-link-user-api-secret-key-change-me-in-production
    expire-seconds: 7200
    refresh-seconds: 604800
  link:
    # 平台自身的短链域名，生成时禁止把链接指向自己
    self-hosts: localhost,127.0.0.1
    default-domain: localhost:8081
    code-length: 7
  sms:
    mock: true
    code-expire-seconds: 300
  minio:
    # 本机 MinIO 与其它项目共用，本项目对象统一放在 bucket 内隔离
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:admin}
    secret-key: ${MINIO_SECRET_KEY:12345678}
    bucket: ${MINIO_BUCKET:short-link}
  sentinel:
    # 留空则不连 Dashboard / 不从 Nacos 拉规则
    dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
    nacos-server: ${NACOS_SERVER:127.0.0.1:8848}
    nacos-group: ${SENTINEL_GROUP:SENTINEL_GROUP}
